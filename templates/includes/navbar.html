{% load static %}
<header class="sticky top-0 z-40 bg-surface/80 backdrop-blur-xl border-b border-outline-variant/20">
    <div class="px-6 py-3">
        <div class="flex items-center justify-between gap-4">
            
            <!-- Left section -->
            <div class="flex items-center gap-4">
                <button id="toggleSidebarBtn" class="p-2 rounded-xl hover:bg-surface-container transition-all duration-200">
                    <span class="material-symbols-outlined text-outline">menu</span>
                </button>
                <div class="hidden md:block">
                    <h1 class="text-xl font-semibold tracking-tight text-on-surface">
                        Bonjour, <span class="gradient-text">{{ user.prenom|default:"Thomas" }} {{ user.nom|default:"Dubois" }}</span>
                    </h1>
                    <p class="text-xs text-on-surface-variant mt-0.5" id="currentDateTime"></p>
                </div>
            </div>
            
            <!-- Right section -->
            <div class="flex items-center gap-2">
                <!-- Search bar -->
                <div class="hidden lg:flex items-center gap-2 px-4 py-2 bg-white rounded-xl border border-outline-variant/20 shadow-sm">
                    <span class="material-symbols-outlined text-outline text-lg">search</span>
                    <input type="text" placeholder="Rechercher..." class="bg-transparent border-none outline-none text-sm w-64 placeholder:text-outline/60">
                    <kbd class="px-1.5 py-0.5 text-[10px] bg-surface-container rounded-md text-outline font-mono">⌘K</kbd>
                </div>
               
                
                <!-- Profile -->
                <div class="relative">
                    <button id="profileBtn" class="flex items-center gap-2 p-1 rounded-xl hover:bg-surface-container transition-all duration-200">
                        {% if user.photo_url %}
                            <img src="{{ user.photo_url }}" class="w-9 h-9 rounded-full object-cover ring-2 ring-primary/20">
                        {% else %}
                            <div class="w-9 h-9 rounded-full bg-primary/10 flex items-center justify-center ring-2 ring-primary/20">
                                <span class="text-sm font-semibold text-primary">{{ user.prenom|slice:":1" }}{{ user.nom|slice:":1" }}</span>
                            </div>
                        {% endif %}
                    </button>
                    
                    <div id="profileMenu" class="absolute right-0 mt-3 w-64 bg-white rounded-2xl shadow-2xl border border-outline-variant/20 hidden z-50 overflow-hidden">
                        <div class="p-3 border-b border-outline-variant/20 flex items-center gap-3">
                            {% if user.photo_url %}
                                <img src="{{ user.photo_url }}" class="w-10 h-10 rounded-full object-cover">
                            {% else %}
                                <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center">
                                    <span class="text-sm font-semibold text-primary">{{ user.prenom|slice:":1" }}{{ user.nom|slice:":1" }}</span>
                                </div>
                            {% endif %}
                            <div>
                                <p class="text-sm font-semibold text-on-surface">{{ user.prenom }} {{ user.nom }}</p>
                                <p class="text-xs text-on-surface-variant">{{ user.email }}</p>
                            </div>
                        </div>
                        <div class="py-2">
                            <a href="{% url 'profile' %}" class="flex items-center gap-3 px-4 py-2.5 text-sm text-on-surface hover:bg-surface-container transition">Mon profil</a>
                            <a href="#" class="flex items-center gap-3 px-4 py-2.5 text-sm text-on-surface hover:bg-surface-container transition">Paramètres</a>
                            <hr class="my-2 border-outline-variant/20">
                            <a href="{% url 'logout' %}" class="flex items-center gap-3 px-4 py-2.5 text-sm text-error hover:bg-error-container/10 transition">Déconnexion</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<script>
    function updateDateTime() {
        const now = new Date();
        const options = { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' };
        const dateTimeEl = document.getElementById('currentDateTime');
        if (dateTimeEl) {
            dateTimeEl.textContent = now.toLocaleDateString('fr-FR', options);
        }
    }
    updateDateTime();
    
    // Rafraîchir l'heure toutes les minutes
    setInterval(updateDateTime, 60000);
</script>
