{% load static %}
<aside id="sidebar" class="sidebar-expanded sidebar-transition fixed left-0 top-0 h-full bg-white/95 backdrop-blur-xl border-r border-outline-variant/20 z-50 overflow-y-auto">
    
    <!-- Logo -->
    <div class="h-16 flex items-center px-5 border-b border-outline-variant/20">
        <!-- Logo version expanded -->
        <div class="flex items-center gap-2 sidebar-expanded-content">
            <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center shadow-sm">
                <span class="material-symbols-outlined text-white text-xl">school</span>
            </div>
            <span class="font-semibold text-on-surface text-xl">MentorLink</span>
        </div>
        
        <!-- Logo version collapsed (icône seule) -->
        <div class="sidebar-collapsed-content hidden w-full justify-center">
            <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center">
                <span class="material-symbols-outlined text-primary text-2xl">school</span>
            </div>
        </div>
    </div>
    
    <!-- Navigation -->
    <nav class="flex-1 py-4 px-3 space-y-1">
        <a href="/dashboard/" class="flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-200 {% if request.path == '/dashboard/' %}bg-primary/10 text-primary{% else %}text-on-surface-variant hover:bg-surface-container{% endif %}">
            <span class="material-symbols-outlined text-xl">dashboard</span>
            <span class="text-sm font-medium nav-text sidebar-text">Tableau de bord</span>
        </a>
        
        <a href="/chat/" class="flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-200 {% if request.path == '/chat/' %}bg-primary/10 text-primary{% else %}text-on-surface-variant hover:bg-surface-container{% endif %}">
            <span class="material-symbols-outlined text-xl">forum</span>
            <span class="text-sm font-medium nav-text sidebar-text">Messages</span>
            <span class="ml-auto bg-error text-white text-[10px] px-1.5 py-0.5 rounded-full sidebar-text">{{ unread_messages_count|default:"0" }}</span>
        </a>
        
        <a href="/feed/" class="flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-200 {% if request.path == '/feed/' %}bg-primary/10 text-primary{% else %}text-on-surface-variant hover:bg-surface-container{% endif %}">
            <span class="material-symbols-outlined text-xl">rss_feed</span>
            <span class="text-sm font-medium nav-text sidebar-text">Le Flux</span>
        </a>
        
        <a href="/my-feed/" class="flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-200 {% if request.path == '/my-feed/' %}bg-primary/10 text-primary{% else %}text-on-surface-variant hover:bg-surface-container{% endif %}">
            <span class="material-symbols-outlined text-xl">campaign</span>
            <span class="text-sm font-medium nav-text sidebar-text">Mes annonces</span>
        </a>
        
        <a href="/sessions/" class="flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-200 {% if request.path == '/sessions/' %}bg-primary/10 text-primary{% else %}text-on-surface-variant hover:bg-surface-container{% endif %}">
            <span class="material-symbols-outlined text-xl">event_note</span>
            <span class="text-sm font-medium nav-text sidebar-text">Mes sessions</span>
        </a>
        
        <a href="/matching/" class="flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-200 {% if request.path == '/matching/' %}bg-primary/10 text-primary{% else %}text-on-surface-variant hover:bg-surface-container{% endif %}">
            <span class="material-symbols-outlined text-xl">handshake</span>
            <span class="text-sm font-medium nav-text sidebar-text">Matching</span>
        </a>
        
        <a href="/profile/" class="flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-200 {% if request.path == '/profile/' %}bg-primary/10 text-primary{% else %}text-on-surface-variant hover:bg-surface-container{% endif %}">
            <span class="material-symbols-outlined text-xl">person</span>
            <span class="text-sm font-medium nav-text sidebar-text">Mon profil</span>
        </a>
        
        <div class="h-px bg-outline-variant/20 my-3"></div>
        
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-on-surface-variant hover:bg-surface-container transition-all duration-200">
            <span class="material-symbols-outlined text-xl">settings</span>
            <span class="text-sm font-medium nav-text sidebar-text">Paramètres</span>
        </a>
        
        <a href="/logout/" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-error/70 hover:bg-error-container/10 hover:text-error transition-all duration-200">
            <span class="material-symbols-outlined text-xl">logout</span>
            <span class="text-sm font-medium sidebar-text">Déconnexion</span>
        </a>
    </nav>
</aside>

<style>
    /* Sidebar states */
    .sidebar-expanded {
        width: 260px;
    }
    
    .sidebar-collapsed {
        width: 80px;
    }
    
    .sidebar-collapsed .sidebar-text,
    .sidebar-collapsed .nav-text {
        display: none;
    }
    
    .sidebar-collapsed .sidebar-expanded-content {
        display: none !important;
    }
    
    .sidebar-collapsed .sidebar-collapsed-content {
        display: flex !important;
    }
    
    .sidebar-expanded .sidebar-collapsed-content {
        display: none !important;
    }
    
    .sidebar-expanded .sidebar-expanded-content {
        display: flex !important;
    }
    
    .sidebar-collapsed nav a {
        justify-content: center;
        padding: 12px;
    }
    
    .main-expanded {
        margin-left: 260px;
    }
    
    .main-collapsed {
        margin-left: 80px;
    }
</style>
